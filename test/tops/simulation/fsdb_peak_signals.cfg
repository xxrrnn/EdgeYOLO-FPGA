# Focused FSDB extraction used to cross-check the Verdi view. fsdbreport takes
# one -s followed by all selected signals; repeating -s retains only the last.
-s /tb_lite_bd_module/tb_aclk
   /tb_lite_bd_module/peak_int8_array_start
   /tb_lite_bd_module/peak_int8_array_done
   /tb_lite_bd_module/peak_int8_compute_fire -of h
   /tb_lite_bd_module/peak_int8_tile0_state -of h
   /tb_lite_bd_module/peak_int8_tile0_phase -of h
   /tb_lite_bd_module/peak_int8_tile0_input -of h
   /tb_lite_bd_module/peak_int8_result_valid
   /tb_lite_bd_module/peak_int8_result_data -of h
-skip_value_no_transition
